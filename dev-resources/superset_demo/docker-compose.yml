x-superset-service: &superset-service
  image: lrsql-superset:6.1.0
  env_file: superset/.env
  environment:
    SUPERSET_AUTH_MODE: ${SUPERSET_AUTH_MODE:-oauth}
  restart: unless-stopped
  volumes:
    - superset_home:/app/superset_home

configs:
  test_realm:
    file: ./keycloak/test-realm.json

volumes:
  db_data:
  redis:
  superset_home:
  superset_db_data:

services:
  db:
    image: postgres:18
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: lrsql_user
      POSTGRES_PASSWORD: lrsql_password
      POSTGRES_DB: lrsql_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrsql_user -d lrsql_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:16.1.0
    command: ["-b", "0.0.0.0", "-c", "standalone.xml"]
    environment:
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: changeme123
      KEYCLOAK_IMPORT: /tmp/test-realm.json
    configs:
      - source: test_realm
        target: /tmp/test-realm.json
    ports:
      - "8081:8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/auth/realms/test/.well-known/openid-configuration",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  lrs:
    image: yetanalytics/lrsql:latest
    command:
      - /lrsql/bin/run_postgres.sh
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      LRSQL_API_KEY_DEFAULT: my_key
      LRSQL_API_SECRET_DEFAULT: my_secret
      LRSQL_ADMIN_USER_DEFAULT: my_username
      LRSQL_ADMIN_PASS_DEFAULT: my_password
      LRSQL_DB_HOST: db
      LRSQL_DB_NAME: lrsql_db
      LRSQL_DB_USER: lrsql_user
      LRSQL_DB_PASSWORD: lrsql_password
      LRSQL_POOL_INITIALIZATION_FAIL_TIMEOUT: 10000
      LRSQL_OIDC_ISSUER: http://host.docker.internal:8081/auth/realms/test
      LRSQL_OIDC_CLIENT_ID: lrs_admin_ui
      LRSQL_OIDC_SCOPE_PREFIX: "lrs:"
      LRSQL_OIDC_AUDIENCE: http://localhost:8080

  supersetdb:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  superset-init:
    <<: *superset-service
    build:
      context: ./superset
    command: ["/app/docker/docker-init.sh"]
    restart: "no"
    depends_on:
      supersetdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  superset:
    <<: *superset-service
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully

  superset-worker:
    <<: *superset-service
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  superset-worker-beat:
    <<: *superset-service
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
